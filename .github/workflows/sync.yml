name: Sync Calendars

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        run: python sync.py

      - name: Commit updated master.ics
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add master.ics
          git commit -m "Update master.ics" || echo "No changes"
          git push
